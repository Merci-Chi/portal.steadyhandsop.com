<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>Set Up Your Account | Steady Hands</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="auth.css"></head><body class="reset-page"><main class="auth-card reset-card onboarding-card"><img class="reset-logo" src="images/logo.png" alt="Steady Hands"><p class="eyebrow">YOUR STEADY HANDS WORKSPACE</p><h1>Set up your profile</h1><p class="sub">Enter your business details. If a salesperson invited you, your website preview will be linked automatically after you sign in.</p><form id="setup"><label for="name">Display name <span class="required" aria-hidden="true">*</span></label><input id="name" autocomplete="nickname" maxlength="120" placeholder="How you would like to be addressed" required><label for="company">Company name <span class="required" aria-hidden="true">*</span></label><input id="company" autocomplete="organization" maxlength="160" placeholder="Your business name" required><fieldset class="domain-preferences" style="border:1px solid #d8e4f1;border-radius:12px;padding:14px;margin-top:18px"><legend style="font-weight:800">Preferred domain names (optional)</legend><p class="sub">We will check availability; these choices do not reserve a domain.</p><label for="domainPrimary">First choice</label><input id="domainPrimary" autocomplete="off" placeholder="yourbusiness.com" maxlength="253"><label for="domainBackup1">Backup choice 1</label><input id="domainBackup1" autocomplete="off" placeholder="yourbusinessonline.com" maxlength="253"><label for="domainBackup2">Backup choice 2</label><input id="domainBackup2" autocomplete="off" placeholder="yourbusinessnv.com" maxlength="253"></fieldset><label for="referral">Referral code <span class="optional">(optional)</span></label><input id="referral" maxlength="64" autocomplete="off" placeholder="Have a referral code? Enter it here"><button class="primary" id="save" type="submit">Continue to Portal <img src="icons/arrow-right.svg" alt="" aria-hidden="true"></button></form><p id="message" role="status" aria-live="polite"></p><button class="text-btn" id="signout" type="button">Sign out</button></main><script type="module" src="onboarding.js"></script></body></html>
