<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>Set Up Your Account | Steady Hands</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="auth.css"></head><body class="reset-page"><main class="auth-card reset-card"><img class="reset-logo" src="images/logo.png" alt="Steady Hands"><p class="eyebrow">FIRST-TIME SETUP</p><h1>Welcome to Steady Hands</h1><p class="sub">Complete your profile to get started. Existing websites and subscriptions will be linked after ownership verification.</p><form id="setup"><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="120" required><label for="phone">Phone (optional)</label><input id="phone" type="tel" autocomplete="tel" maxlength="40"><button class="primary" id="save" type="submit">Continue to Portal</button></form><p id="message" role="status" aria-live="polite"></p><button class="text-btn" id="signout" type="button">Sign out</button></main><script type="module" src="onboarding.js"></script></body></html>
