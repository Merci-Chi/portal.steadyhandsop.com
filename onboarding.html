<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>Set Up Your Account | Steady Hands</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="auth.css"></head><body class="reset-page"><main class="auth-card reset-card onboarding-card"><img class="reset-logo" src="images/logo.png" alt="Steady Hands"><p class="eyebrow">YOUR STEADY HANDS WORKSPACE</p><h1>Set up your profile</h1><p class="sub">Just two details to get started. Your website and services will be linked after verification.</p><form id="setup"><label for="name">Display name <span class="required" aria-hidden="true">*</span></label><input id="name" autocomplete="nickname" maxlength="120" placeholder="How you would like to be addressed" required><label for="company">Company name <span class="required" aria-hidden="true">*</span></label><input id="company" autocomplete="organization" maxlength="160" placeholder="Your business name" required><label for="referral">Referral code <span class="optional">(optional)</span></label><input id="referral" maxlength="64" autocomplete="off" placeholder="Have a referral code? Enter it here"><button class="primary" id="save" type="submit">Continue to Portal <img src="icons/arrow-right.svg" alt="" aria-hidden="true"></button></form><p id="message" role="status" aria-live="polite"></p><button class="text-btn" id="signout" type="button">Sign out</button></main><script type="module" src="onboarding.js"></script></body></html>
